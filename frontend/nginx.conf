# ============================================================
# nginx config для SPA (React Router) + reverse-proxy на backend.
# Один контейнер отдаёт статику и проксирует /api, /ws на backend:8000
# через внутреннюю docker-сеть.
# ============================================================

# Upstream на backend-контейнер. Имя `backend` резолвится docker DNS внутри
# compose-сети. resolver нужен чтобы перечитывать DNS (контейнер может
# рестартануть и получить новый IP).
upstream backend_upstream {
    server backend:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Лимит на тело запроса (защита от больших payload'ов)
    client_max_body_size 2m;

    # gzip для текстовых ассетов
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ===== Reverse proxy на backend =====
    # /api/* → backend (REST). /ws/* → backend (WebSocket с upgrade).
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        # Загрузка картинок (POST /api/admin/images) — до 10 МБ на бэке,
        # даём запас. Перекрывает server-level client_max_body_size.
        client_max_body_size 12m;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        # Не кэшируем API-ответы
        proxy_cache_bypass $http_upgrade;
    }

    # WebSocket (требуется Upgrade-заголовок)
    location /ws/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # Долгий таймаут для idle WebSocket-соединений
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ===== Медиа с backend'а (StaticFiles mountы /audio и /images) =====
    # narrator-аудио (/audio/{storage_path}) и загруженные картинки
    # (/images/{storage_path}) отдаёт backend, а не статика SPA. ^~ нужен,
    # чтобы эти префиксы имели приоритет над regex-локацией медиа
    # ниже (иначе .mp3/.png уходят в try_files по статике → 404).
    location ^~ /audio/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        expires 30d;
        add_header Cache-Control "public";
    }

    location ^~ /images/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        expires 30d;
        add_header Cache-Control "public";
    }

    # ===== Статика SPA =====
    # CRA кладёт ассеты в /static/ с hash'ем в имени → можно кэшировать год
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Изображения / шрифты / медиа
    location ~* \.(?:ico|png|jpg|jpeg|gif|webp|svg|woff2?|ttf|eot|mp3|wav|ogg)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # SPA fallback: любые неизвестные пути отдают index.html,
    # чтобы React Router обработал маршрут на клиенте.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Healthcheck — отдельный путь чтобы host-nginx / docker мог проверять
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --frozen || uv sync

      - name: Run unit tests
        env:
          SECRET_KEY: "ci-secret-key-32-characters-minimum!!"
          APP_ENV: "test"
        run: |
          uv run pytest tests/unit/ \
            --ignore=tests/unit/test_dev_test_lobby_service.py \
            --ignore=tests/unit/test_smoke_openapi.py \
            -q

  frontend:
    name: Frontend (build + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        env:
          CI: "true"
        run: npm test -- --watchAll=false --passWithNoTests

      - name: Build
        env:
          CI: "false"
        run: npm run build

stages:
  - test
  - build

backend:
  stage: test
  image: python:3.12-slim
  timeout: 10 minutes
  script:
    - ls -la
    - pip install uv
    - cd backend && uv sync --frozen || uv sync
    - uv run pytest tests/unit/ --ignore=tests/unit/test_dev_test_lobby_service.py --ignore=tests/unit/test_smoke_openapi.py -q
  variables:
    SECRET_KEY: "ci-secret-key-32-characters-minimum!!"
    APP_ENV: "test"

frontend:
  stage: test
  image: node:20-slim
  timeout: 15 minutes
  script:
    - ls -la
    - cd frontend && npm ci --no-audit --no-fund
    - npm test -- --watchAll=false --passWithNoTests
  variables:
    CI: "true"

frontend-build:
  stage: build
  image: node:20-slim
  timeout: 15 minutes
  needs: ["frontend"]
  script:
    - cd frontend && npm ci --no-audit --no-fund
    - npm run build
  variables:
    CI: "false"
  artifacts:
    paths:
      - frontend/build/
    expire_in: 1 week

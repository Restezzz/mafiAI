# GitLab CI/CD для Mafia AI (mafia.patgen.ru).
#
# Тесты запускаются на любой push/MR (shared runners).
# Деплой триггерится только на push в main (self-hosted runner
# с тегом "deploy" на сервере mafia.patgen.ru).

stages:
  - test
  - build
  - deploy

backend:
  stage: test
  image: python:3.12-slim
  timeout: 10 minutes
  script:
    - pip install uv
    - cd backend && uv sync --frozen || uv sync
    - uv run pytest tests/unit/ --ignore=tests/unit/test_dev_test_lobby_service.py --ignore=tests/unit/test_smoke_openapi.py -q
  variables:
    SECRET_KEY: "ci-secret-key-32-characters-minimum!!"
    APP_ENV: "test"

frontend:
  stage: test
  image: node:20-slim
  timeout: 15 minutes
  script:
    - cd frontend && npm ci --no-audit --no-fund
    - npm test -- --watchAll=false --passWithNoTests
  variables:
    CI: "true"

frontend-build:
  stage: build
  image: node:20-slim
  timeout: 15 minutes
  needs: ["frontend"]
  script:
    - cd frontend && npm ci --no-audit --no-fund
    - npm run build
  variables:
    CI: "false"
  artifacts:
    paths:
      - frontend/build/
    expire_in: 1 week

deploy:
  stage: deploy
  tags:
    - deploy
  needs: ["backend", "frontend-build"]
  script:
    - sudo /usr/local/bin/mafia-deploy.sh "$CI_PROJECT_DIR"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE != "merge_request_event"'

# ============================================================
# Конфиг для host-nginx на сервере (НЕ для docker-контейнера).
# Положить в /etc/nginx/sites-available/mafia.patgen.ru.conf
# и слинковать в /etc/nginx/sites-enabled/.
#
# Предполагается:
#  - certbot установлен (apt install certbot python3-certbot-nginx)
#  - DNS A-запись mafia.patgen.ru → IP сервера уже настроена
#  - docker compose -f docker-compose.prod.yml up слушает 127.0.0.1:8080
#
# Получение TLS:
#   sudo certbot --nginx -d mafia.patgen.ru
# (certbot сам допишет ssl_certificate / listen 443 ssl блоки.)
# ============================================================

# HTTP → HTTPS redirect (certbot обычно правит автоматически)
server {
    listen 80;
    listen [::]:80;
    server_name mafia.patgen.ru;

    # Для ACME http-01 challenge (certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — основной сервер
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mafia.patgen.ru;

    # ВАЖНО: эти строки впишет certbot. После запуска `certbot --nginx`
    # они появятся автоматически. Закомментированы пока сертификат не выпущен.
    # ssl_certificate     /etc/letsencrypt/live/mafia.patgen.ru/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/mafia.patgen.ru/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Базовые security-заголовки
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Лимит размера тела запроса. 12m — чтобы проходила загрузка картинок
    # сюжета (POST /api/admin/images, до 10 МБ на бэке). Меньший лимит даст
    # 413 ещё на TLS-терминаторе, до docker-фронта.
    client_max_body_size 12m;

    # Таймауты для долгих WebSocket-соединений
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # ===== Reverse-proxy на docker frontend (который сам прокидывает /api и /ws на backend) =====
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # WebSocket upgrade headers (нужны, т.к. /ws/* идёт через этот же proxy_pass)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Не буферим — критично для streaming-ответов и WS
        proxy_buffering off;
    }

    # gzip-сжатие на host-уровне (frontend nginx уже жмёт, но дубль не повредит)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml;
}

# Обязательно добавить в /etc/nginx/nginx.conf (внутри http {}):
#
# map $http_upgrade $connection_upgrade {
#     default upgrade;
#     ''      close;
# }
#
# Если этого map'а нет — WebSocket не заработает.

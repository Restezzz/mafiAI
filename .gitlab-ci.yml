stages:
  - test
  - build

backend:
  stage: test
  image: python:3.12-slim
  timeout: 10 minutes
  before_script:
    - pip install uv
    - cd backend
    - uv sync --frozen || uv sync
  script:
    - cd backend
    - uv run pytest tests/unit/
        --ignore=tests/unit/test_dev_test_lobby_service.py
        --ignore=tests/unit/test_smoke_openapi.py
        -q
  variables:
    SECRET_KEY: "ci-secret-key-32-characters-minimum!!"
    APP_ENV: "test"

frontend:
  stage: test
  image: node:20-slim
  timeout: 15 minutes
  before_script:
    - cd frontend
    - npm ci --no-audit --no-fund
  script:
    - cd frontend
    - npm test -- --watchAll=false --passWithNoTests
  variables:
    CI: "true"

frontend-build:
  stage: build
  image: node:20-slim
  timeout: 15 minutes
  needs: ["frontend"]
  before_script:
    - cd frontend
    - npm ci --no-audit --no-fund
  script:
    - cd frontend
    - npm run build
  variables:
    CI: "false"
  artifacts:
    paths:
      - frontend/build/
    expire_in: 1 week
